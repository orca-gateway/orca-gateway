version: "3"

vars:
  ENGINE_DIR: engine
  SDK_DIR: sdk
  DASH_DIR: dashboard

tasks:
  # === Top-level ===
  dev:
    desc: Start engine dev server
    cmds:
      - task: engine:dev

  test:all:
    desc: Run all tests (engine + engine-dart + SDK + DevTools)
    cmds:
      - task: engine:test
      - task: engine-dart:test
      - task: sdk:test
      - task: devtools:test

  # === Engine ===
  engine:dev:
    desc: Start engine in dev mode with hot reload
    dir: "{{.ENGINE_DIR}}"
    cmds:
      - bun run --watch src/server.ts

  engine:test:
    desc: Run engine tests
    dir: "{{.ENGINE_DIR}}"
    cmds:
      - bun test

  engine:lint:
    desc: Lint and format-check engine code
    dir: "{{.ENGINE_DIR}}"
    cmds:
      - bun run lint

  engine:build:
    desc: Build engine for production
    dir: "{{.ENGINE_DIR}}"
    cmds:
      - bun build src/server.ts --outdir dist --target bun

  # === Engine (Dart) ===
  engine-dart:dev:
    desc: Start Dart engine example server
    dir: examples/server-dart
    cmds:
      - dart run main.dart

  engine-dart:test:
    desc: Run Dart engine tests (conformance suite)
    dir: engine-dart
    cmds:
      - dart test

  engine-dart:analyze:
    desc: Run Dart static analysis on engine-dart
    dir: engine-dart
    cmds:
      - dart analyze

  engine-dart:gen:
    desc: Regenerate widget registry + builder shells
    dir: engine-dart
    cmds:
      - dart run tool/gen_widget_registry.dart
      - dart run tool/gen_widget_builders.dart

  # === SDK ===
  sdk:test:
    desc: Run SDK tests
    dir: "{{.SDK_DIR}}"
    cmds:
      - flutter test

  sdk:analyze:
    desc: Run Flutter static analysis
    dir: "{{.SDK_DIR}}"
    cmds:
      - flutter analyze

  # === SDK (Swift, experimental: Epic 23b) ===
  sdk-swift:test:
    desc: Run the iOS SDK core tests (pure Swift; macOS or Linux with a Swift toolchain)
    dir: sdk-swift
    cmds:
      - swift test

  sdk-swift:gen:
    desc: Regenerate the Swift and Kotlin capability vectors (run after schema/gen-widget-registry.ts)
    cmds:
      - bun run schema/gen-native-capabilities.ts

  sdk-swift:test:ios:
    desc: Run every iOS SDK test on an iOS simulator, the golden included (macOS with Xcode)
    dir: sdk-swift
    cmds:
      - xcodebuild test -scheme OrcaGateway-Package -destination 'platform=iOS Simulator,name={{.SIM | default "iPhone 16 Pro"}}'

  sdk-swift:record:
    desc: Re-record the pages the Swift tests load, through the Swift caps handshake
    cmds:
      - bun run examples/server/record-page.ts counter home sdk-swift/Tests/Pages/counter-home.json
      - bun run examples/server/record-page.ts capability-demo degrade sdk-swift/Tests/Pages/degrade-graceful.json --policy graceful
      - bun run examples/server/record-page.ts capability-demo degrade sdk-swift/Tests/Pages/degrade-warn.json --policy warn
      - bun run examples/server/record-page.ts capability-demo degrade sdk-swift/Tests/Pages/degrade-require.json --policy require
      - bun run examples/server/record-page.ts capability-demo degrade sdk-swift/Tests/Pages/degrade-426.json --min-sdk 99.0.0 --sdk-version 0.1.0
      - bun run examples/server/record-page.ts native-widgets home sdk-swift/Tests/Pages/native-widgets-home.json

  # === SDK (Kotlin, experimental: Epic 23b) ===
  sdk-kotlin:test:
    desc: Run the Android SDK tests, core on the JVM and sdk under Robolectric (any JDK 17 or later)
    dir: sdk-kotlin
    cmds:
      - ./gradlew :core:test :sdk:testDebugUnitTest --console=plain

  sdk-kotlin:build:
    desc: Build both Android SDK modules with tests and lint, warnings as errors (what CI runs)
    dir: sdk-kotlin
    cmds:
      - ./gradlew build --console=plain

  sdk-kotlin:gen:
    desc: Regenerate the Kotlin and Swift capability vectors (run after schema/gen-widget-registry.ts)
    cmds:
      - bun run schema/gen-native-capabilities.ts

  sdk-kotlin:record:
    desc: Re-record the pages the Kotlin tests load, through the Kotlin caps handshake
    cmds:
      - bun run examples/server/record-page.ts counter home sdk-kotlin/sdk/src/test/resources/pages/counter-home.json --sdk kotlin
      - bun run examples/server/record-page.ts capability-demo degrade sdk-kotlin/sdk/src/test/resources/pages/degrade-graceful.json --sdk kotlin --policy graceful
      - bun run examples/server/record-page.ts capability-demo degrade sdk-kotlin/sdk/src/test/resources/pages/degrade-warn.json --sdk kotlin --policy warn
      - bun run examples/server/record-page.ts capability-demo degrade sdk-kotlin/sdk/src/test/resources/pages/degrade-require.json --sdk kotlin --policy require
      - bun run examples/server/record-page.ts capability-demo degrade sdk-kotlin/sdk/src/test/resources/pages/degrade-426.json --sdk kotlin --min-sdk 99.0.0 --sdk-version 0.1.0
      - bun run examples/server/record-page.ts native-widgets home sdk-kotlin/sdk/src/test/resources/pages/native-widgets-home.json --sdk kotlin

  # === Example app ===
  example:dev:
    desc: Start example app and server in parallel
    deps: 
      - example:dev:app
      - example:dev:server
      - devtools:dev
    
  
  example:dev:app:
    desc: Start example app in dev mode (Android)
    dir: examples/app
    cmds:
      - flutter run 
  example:dev:server:
    desc: Start example server in dev mode
    dir: examples/server
    cmds:
      - bun run --watch index.ts

  example:ios:build:
    desc: Build the iOS counter example for the simulator (open examples/app-ios in Xcode to run it)
    dir: examples/app-ios
    cmds:
      - xcodebuild build -project OrcaCounter.xcodeproj -scheme OrcaCounter -destination 'generic/platform=iOS Simulator'

  example:android:build:
    desc: Build the Android counter example (debug APK; builds sdk-kotlin from source)
    dir: examples/app-android
    cmds:
      - ./gradlew :app:assembleDebug --console=plain

  example:android:run:
    desc: Install the Android counter example on the running emulator or device and start it (URL=http://10.0.2.2:8080 by default)
    dir: examples/app-android
    cmds:
      - ./gradlew :app:installDebug --console=plain
      - adb shell am start -n com.orcagateway.examples.counter/.MainActivity --es ORCA_SERVER_URL {{.URL | default "http://10.0.2.2:8080"}} --es ORCA_APP_ID {{.APP | default "counter"}} --es ORCA_PATH {{.PAGE | default "home"}}

  # === Docs ===
  docs:dev:
    desc: Start docs site dev server (Docusaurus v3)
    dir: docs-site
    cmds:
      - bun run start

  docs:build:
    desc: Build docs site for production
    dir: docs-site
    cmds:
      - bun run build

  docs:clear:
    desc: Clear Docusaurus build cache
    dir: docs-site
    cmds:
      - bun run clear

  # === Dashboard ===
  dash:dev:
    desc: Start dashboard dev server
    dir: "{{.DASH_DIR}}"
    cmds:
      - bun run dev

  # === Devtools ===
  devtools:dev:
    desc: Start Devtools dev server
    dir: devtools
    cmds:
      - flutter run -d macos

  devtools:test:
    desc: Run DevTools tests (includes the DevTools events fixture parse test)
    dir: devtools
    cmds:
      - flutter test

  # === Docker ===
  docker:up:
    desc: Start Docker services (PostgreSQL)
    cmds:
      - docker compose up -d

  docker:down:
    desc: Stop Docker services
    cmds:
      - docker compose down
