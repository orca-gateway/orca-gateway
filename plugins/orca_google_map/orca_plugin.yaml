name: orca_google_map
display_name: Google Map
description: Server-driven Google Maps with markers, camera control, and gesture events.

# Epic 38 Slice B — declarative preview. The stub composes only core Orca Gateway
# widgets, so the compiled JSON renders inside the stock Flutter Web preview
# editor with no rebuild. Run `orca plugin build` after editing stub.ts to
# regenerate stub.compiled.json.
preview:
  kind: declarative
  stub: preview/stub.ts
  compiledStub: preview/stub.compiled.json

marketplace:
  icons:
    small: assets/icon-32.png
    medium: assets/icon-64.png
    large: assets/icon-128.png
  screenshots:
    - path: assets/screenshot-1.png
      caption: "Google Map with markers and camera control"
  tagline: "Server-driven Google Maps with markers, camera control, and gesture events."

platform:
  android:
    min_sdk: 21
    permissions:
      - android.permission.ACCESS_FINE_LOCATION
      - android.permission.ACCESS_COARSE_LOCATION
    manifest_meta:
      - name: com.google.android.geo.API_KEY
        value: "${GOOGLE_MAPS_ANDROID_API_KEY}"

  ios:
    min_version: "15.0"
    plist:
      - key: NSLocationWhenInUseUsageDescription
        value: "This app needs location access to show your position on the map"
      - key: GOOGLE_MAPS_IOS_API_KEY
        value: "${GOOGLE_MAPS_IOS_API_KEY}"
    appdelegate:
      imports:
        - GoogleMaps
      did_finish_launching:
        - 'GMSServices.provideAPIKey(Bundle.main.object(forInfoDictionaryKey: "GOOGLE_MAPS_IOS_API_KEY") as? String ?? "")'

env:
  - key: GOOGLE_MAPS_ANDROID_API_KEY
    description: "Google Maps API key for Android (from Google Cloud Console)"
    required: true
    platforms: [android]
  - key: GOOGLE_MAPS_IOS_API_KEY
    description: "Google Maps API key for iOS (from Google Cloud Console)"
    required: true
    platforms: [ios]

setup_steps:
  - "Create a Google Cloud project and enable the Maps SDK for iOS and Android"
  - "Generate an API key at https://console.cloud.google.com/apis/credentials"

# What the Flutter plugin implements (lib/src/google_map_plugin.dart), for
# `orca plugin generate` (TypeScript, Swift, Kotlin).
# cli/test/google_map_schema_test.dart pins it against that source.
# The CLI reads the names, `type`, `required` and `enum`; `default`,
# `description` and `event_data` are notes for the native ports.
schema:
  widgets:
    GoogleMap:
      kind: primitive
      description: "The platform's Google map, its camera first at latitude, longitude and zoom, drawn as mapType, with a pin per marker; a tap on a pin opens its info window (title, snippet)."
      props:
        latitude: { type: number, default: 0, description: "The initial camera's latitude: read when the map is created; later only moveCamera moves the camera. A non-number fails the map's build." }
        longitude: { type: number, default: 0, description: "The initial camera's longitude: read when the map is created; later only moveCamera moves the camera. A non-number fails the map's build." }
        zoom: { type: number, default: 14, description: "The initial camera's zoom, Google's zoom level: read when the map is created; later only moveCamera moves the camera. A non-number fails the map's build." }
        mapType: { type: string, enum: [normal, satellite, terrain, hybrid], default: normal, description: "The map's tiles; any other string draws normal, a non-string fails the map's build." }
        myLocationEnabled: { type: boolean, default: false, description: "Shows the device's location on the map (once the app holds location permission; the plugin never asks for it). A non-boolean fails the map's build." }
        zoomControlsEnabled: { type: boolean, default: true, description: "Shows the map's zoom + and - buttons (on Android; the iOS map has none). A non-boolean fails the map's build." }
        markers:
          type: array
          description: "The map's pins; a non-array fails the map's build. An entry that is not an object, or lacks latitude or longitude, is skipped; a non-number latitude or longitude fails the map's build."
          items:
            type: object
            name: MapMarker
            props:
              id: { type: string, default: "", description: "The marker's id, which onMarkerTap fires as markerId; a non-string is used as its text." }
              latitude: { type: number, required: true, description: "The pin's latitude; a non-number fails the map's build." }
              longitude: { type: number, required: true, description: "The pin's longitude; a non-number fails the map's build." }
              title: { type: string, default: "", description: "The info window's title; a non-string fails the map's build." }
              snippet: { type: string, description: "The info window's text under the title; a non-string fails the map's build." }
      triggers: [onTap, onLongPress, onCameraMove, onMarkerTap]
      # The eventData each trigger fires with.
      event_data:
        onTap:
          description: "A tap on the map, off any marker."
          props:
            latitude: { type: number, description: "The tapped point's latitude." }
            longitude: { type: number, description: "The tapped point's longitude." }
        onLongPress:
          description: "A long press on the map."
          props:
            latitude: { type: number, description: "The pressed point's latitude." }
            longitude: { type: number, description: "The pressed point's longitude." }
        onCameraMove:
          description: "Repeatedly while the camera moves, from a gesture or moveCamera's animation."
          props:
            latitude: { type: number, description: "The camera target's latitude." }
            longitude: { type: number, description: "The camera target's longitude." }
            zoom: { type: number, description: "The camera's zoom, Google's zoom level." }
        onMarkerTap:
          description: "A tap on a marker's pin; the map also opens the marker's info window."
          props:
            markerId: { type: string, description: "The tapped marker's id." }

  actions:
    moveCamera:
      description: "Animates the camera of the map targetId names to latitude, longitude at zoom. Fires no trigger itself; the map's onCameraMove fires as the camera moves."
      params:
        targetId: { type: string, required: true, description: "The map node's id, resolved as a value; a non-string is used as its text, and an empty or unknown id does nothing." }
        latitude: { type: number, required: true, description: "Resolved as a value; missing does nothing, a non-number fails the action." }
        longitude: { type: number, required: true, description: "Resolved as a value; missing does nothing, a non-number fails the action." }
        zoom: { type: number, default: 14, description: "Google's zoom level, resolved as a value; a non-number fails the action." }
