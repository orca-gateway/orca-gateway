org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official

# Publishing (com.vanniktech.maven.publish): both modules go to Maven Central
# through the Central Portal and are released once the upload validates.
mavenCentralPublishing=true
mavenCentralAutomaticPublishing=true
# The POM both artifacts share; each module adds its name and description.
POM_URL=https://github.com/orca-gateway/orca-gateway
POM_LICENCE_NAME=Business Source License 1.1
POM_LICENCE_URL=https://github.com/orca-gateway/orca-gateway/blob/main/sdk-kotlin/LICENSE
POM_LICENCE_DIST=repo
POM_SCM_URL=https://github.com/orca-gateway/orca-gateway
POM_SCM_CONNECTION=scm:git:git://github.com/orca-gateway/orca-gateway.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/orca-gateway/orca-gateway.git
POM_DEVELOPER_ID=orca-gateway
POM_DEVELOPER_NAME=Orca Gateway
POM_DEVELOPER_URL=https://github.com/orca-gateway
