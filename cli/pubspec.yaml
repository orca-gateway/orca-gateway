name: orca_gateway_cli
description: "Command-line tool for Orca Gateway projects — manages plugins, patches native config, and scaffolds new servers."
version: 0.1.1
homepage: https://orcagateway.com
repository: https://github.com/orca-gateway/orca-gateway
issue_tracker: https://github.com/orca-gateway/orca-gateway/issues
topics:
  - cli
  - sdui
  - server-driven-ui
  - flutter
  - tooling

environment:
  sdk: ^3.11.3

executables:
  orca: orca

dependencies:
  args: ^2.6.0
  yaml: ^3.1.0
  xml: ^6.5.0
  path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
