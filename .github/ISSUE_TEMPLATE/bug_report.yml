name: Bug Report
description: Report a bug in Orca Gateway
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Orca Gateway is affected?
      options:
        - Engine (TypeScript)
        - SDK (Flutter)
        - Schema
        - Plugins
        - CLI
        - DevTools
        - Documentation
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: "Orca Gateway version (e.g. 0.1.0)"
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      description: "Bun version (engine) or Flutter version (SDK)"
      placeholder: "Bun 1.2.x / Flutter 3.x.x"

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows
        - iOS
        - Android
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the bug
      placeholder: |
        1. Start the engine with `task engine:dev`
        2. Send a request to ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste any relevant logs, error messages, or screenshots
      render: shell
