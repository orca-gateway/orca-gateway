name: SDK Kotlin CI

# The pure-Kotlin core of the Android SDK (sdk-kotlin/core, JVM only) on Linux,
# per PR: models, resolver, store, executor and render tree against the shared
# conformance fixtures in schema/fixtures (Epic 23b, S6). The Compose layer and
# its emulator jobs join from S7.
on:
  push:
    paths:
      - "sdk-kotlin/**"
      - "schema/**"
      - ".github/workflows/sdk-kotlin.yml"
  pull_request:
    paths:
      - "sdk-kotlin/**"
      - "schema/**"
      - ".github/workflows/sdk-kotlin.yml"

jobs:
  core-tests:
    name: Core tests (JDK ${{ matrix.java }}, linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the bytecode floor and Gradle 9's minimum; 21 is the current LTS.
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # Caches ~/.gradle and checks the committed wrapper jar against Gradle's checksums.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test (warnings as errors; fixtures from ../schema)
        run: ./gradlew :core:build --console=plain
        working-directory: sdk-kotlin

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-kotlin-core-tests-jdk${{ matrix.java }}
          path: sdk-kotlin/core/build/reports/tests/test
