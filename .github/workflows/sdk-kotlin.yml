name: SDK Kotlin CI

# The Android SDK on Linux, per PR (Epic 23b): the pure-Kotlin core
# (sdk-kotlin/core, JVM) against the shared conformance fixtures in
# schema/fixtures, the Android library (sdk-kotlin/sdk) with its Compose UI
# tests under Robolectric, and the example app's debug build. Then the Maven
# publication is staged to a local directory and a scratch consumer is built
# against it alone (scripts/maven-verify.sh). No emulator: the example runs on
# one by hand (examples/app-android/README.md).
on:
  push:
    paths:
      - "sdk-kotlin/**"
      - "schema/**"
      - "examples/app-android/**"
      - "scripts/maven-verify.sh"
      - ".github/workflows/sdk-kotlin.yml"
  pull_request:
    paths:
      - "sdk-kotlin/**"
      - "schema/**"
      - "examples/app-android/**"
      - "scripts/maven-verify.sh"
      - ".github/workflows/sdk-kotlin.yml"

jobs:
  sdk:
    name: SDK tests and example (JDK ${{ matrix.java }}, linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the bytecode floor and Gradle 9's minimum; 21 is the current LTS.
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # Caches ~/.gradle and checks the committed wrapper jar against Gradle's checksums.
      - uses: gradle/actions/setup-gradle@v4

      # Both modules: compile with warnings as errors, unit tests (core on the
      # JVM, sdk under Robolectric), lint. The runner's Android SDK suffices.
      - name: Build and test the SDK (fixtures from ../schema)
        run: ./gradlew build --console=plain
        working-directory: sdk-kotlin

      - name: Build the example app (debug)
        run: ./gradlew :app:assembleDebug --console=plain
        working-directory: examples/app-android

      # The publication as Maven Central would get it, unsigned (no secrets
      # here), and an app that takes com.orcagateway from it and nowhere else.
      # One leg: the artifacts are Java 17 bytecode on both, and 17 is the floor.
      - name: Stage the Maven publication
        if: matrix.java == '17'
        run: ./gradlew publishAllPublicationsToStagingRepository --console=plain
        working-directory: sdk-kotlin

      - name: Verify a scratch consumer against the staged publication
        if: matrix.java == '17'
        run: bash scripts/maven-verify.sh "file://$GITHUB_WORKSPACE/sdk-kotlin/build/staging-repo" "$(cat sdk-kotlin/VERSION)"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-kotlin-tests-jdk${{ matrix.java }}
          path: |
            sdk-kotlin/core/build/reports/tests
            sdk-kotlin/sdk/build/reports/tests
            sdk-kotlin/sdk/build/reports/lint-results-*.html
