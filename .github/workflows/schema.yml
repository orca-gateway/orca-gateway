name: Schema CI

on:
  push:
    paths:
      - "schema/**"
      - "engine/src/components/**"
      - "engine/src/types/**"
      - "sdk/pubspec.yaml"
      - "sdk/lib/src/capabilities/**"
      - "sdk-swift/VERSION"
      - "sdk-swift/capabilities.json"
      - "sdk-swift/Sources/OrcaGatewayCore/Capabilities/Generated.swift"
      - ".github/workflows/schema.yml"
  pull_request:
    paths:
      - "schema/**"
      - "engine/src/components/**"
      - "engine/src/types/**"
      - "sdk/pubspec.yaml"
      - "sdk/lib/src/capabilities/**"
      - "sdk-swift/VERSION"
      - "sdk-swift/capabilities.json"
      - "sdk-swift/Sources/OrcaGatewayCore/Capabilities/Generated.swift"
      - ".github/workflows/schema.yml"

jobs:
  drift-check:
    name: Codegen drift detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - run: bun install
        working-directory: engine

      - name: Regenerate widget registry
        run: bun run schema/gen-widget-registry.ts

      - name: Check for drift
        run: |
          if ! git diff --exit-code -- engine/src/core/widget-registry-gen.ts schema/widget-registry.json; then
            echo "::error::Widget registry is out of date. Run 'bun run schema/gen-widget-registry.ts' and commit the result."
            exit 1
          fi

      - name: Regenerate Dart SDK capabilities
        run: bun run schema/gen-sdk-capabilities.ts

      - name: Check Dart SDK capabilities for drift
        run: |
          if ! git diff --exit-code -- sdk/lib/src/capabilities/generated.dart; then
            echo "::error::Dart SDK capability vector is out of date. Run 'bun run schema/gen-sdk-capabilities.ts' and commit the result."
            exit 1
          fi

      - name: Regenerate native (Swift) capabilities
        run: bun run schema/gen-native-capabilities.ts

      - name: Check native capabilities for drift
        run: |
          if ! git diff --exit-code -- sdk-swift/Sources/OrcaGatewayCore/Capabilities/Generated.swift; then
            echo "::error::Swift capability vector is out of date. Run 'bun run schema/gen-native-capabilities.ts' and commit the result."
            exit 1
          fi
