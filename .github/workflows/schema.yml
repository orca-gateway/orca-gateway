name: Schema CI

on:
  push:
    paths:
      - "schema/**"
      - "engine/src/components/**"
      - "engine/src/types/**"
      - "sdk/pubspec.yaml"
      - "sdk/lib/src/capabilities/**"
      - "sdk-swift/VERSION"
      - "sdk-swift/capabilities.json"
      - "sdk-swift/Sources/OrcaGatewayCore/Capabilities/Generated.swift"
      - "sdk-kotlin/VERSION"
      - "sdk-kotlin/capabilities.json"
      - "sdk-kotlin/core/src/main/kotlin/com/orcagateway/core/capabilities/Generated.kt"
      - "sdk-swift/Tests/Pages/**"
      - "engine/src/core/**"
      - "examples/server/**"
      - ".github/workflows/schema.yml"
  pull_request:
    paths:
      - "schema/**"
      - "engine/src/components/**"
      - "engine/src/types/**"
      - "sdk/pubspec.yaml"
      - "sdk/lib/src/capabilities/**"
      - "sdk-swift/VERSION"
      - "sdk-swift/capabilities.json"
      - "sdk-swift/Sources/OrcaGatewayCore/Capabilities/Generated.swift"
      - "sdk-kotlin/VERSION"
      - "sdk-kotlin/capabilities.json"
      - "sdk-kotlin/core/src/main/kotlin/com/orcagateway/core/capabilities/Generated.kt"
      - "sdk-swift/Tests/Pages/**"
      - "engine/src/core/**"
      - "examples/server/**"
      - ".github/workflows/schema.yml"

jobs:
  drift-check:
    name: Codegen drift detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - run: bun install
        working-directory: engine

      - name: Regenerate widget registry
        run: bun run schema/gen-widget-registry.ts

      - name: Check for drift
        run: |
          if ! git diff --exit-code -- engine/src/core/widget-registry-gen.ts schema/widget-registry.json; then
            echo "::error::Widget registry is out of date. Run 'bun run schema/gen-widget-registry.ts' and commit the result."
            exit 1
          fi

      - name: Regenerate Dart SDK capabilities
        run: bun run schema/gen-sdk-capabilities.ts

      - name: Check Dart SDK capabilities for drift
        run: |
          if ! git diff --exit-code -- sdk/lib/src/capabilities/generated.dart; then
            echo "::error::Dart SDK capability vector is out of date. Run 'bun run schema/gen-sdk-capabilities.ts' and commit the result."
            exit 1
          fi

      - name: Regenerate native (Swift and Kotlin) capabilities
        run: bun run schema/gen-native-capabilities.ts

      - name: Check native capabilities for drift
        run: |
          if ! git diff --exit-code -- sdk-swift/Sources/OrcaGatewayCore/Capabilities/Generated.swift; then
            echo "::error::Swift capability vector is out of date. Run 'bun run schema/gen-native-capabilities.ts' and commit the result."
            exit 1
          fi
          if ! git diff --exit-code -- sdk-kotlin/core/src/main/kotlin/com/orcagateway/core/capabilities/Generated.kt; then
            echo "::error::Kotlin capability vector is out of date. Run 'bun run schema/gen-native-capabilities.ts' and commit the result."
            exit 1
          fi

      # The Swift tests load pages recorded from the example server through the
      # Swift caps handshake; re-record and fail when the server's output moved.
      - name: Re-record the Swift test pages
        run: bun run examples/server/record-page.ts counter home sdk-swift/Tests/Pages/counter-home.json

      - name: Check the Swift test pages for drift
        run: |
          if ! git diff --exit-code -- sdk-swift/Tests/Pages/; then
            echo "::error::A recorded Swift test page is out of date. Run 'task sdk-swift:record' and commit the result."
            exit 1
          fi
