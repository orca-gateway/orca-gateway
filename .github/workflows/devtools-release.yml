name: DevTools Release

on:
  push:
    tags:
      - "devtools-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. devtools-v0.1.0)"
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.5"

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve version from tag
        id: version
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF#devtools-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        id: cert
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -e
          if [ -z "$MACOS_CERTIFICATE_P12" ]; then
            echo "::warning::MACOS_CERTIFICATE_P12 secret not set — building unsigned macOS .dmg (skipping codesign and notarization)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          CERT_PATH="$RUNNER_TEMP/devid.p12"

          echo -n "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -n 1 | awk -F'"' '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in keychain"
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Flutter build
        working-directory: devtools
        run: |
          flutter pub get
          flutter build macos --release

      - name: Code-sign the .app
        if: steps.cert.outputs.signed == 'true'
        working-directory: devtools
        run: |
          set -e
          APP="build/macos/Build/Products/Release/Orca Gateway DevTools.app"
          codesign --force --deep --options runtime --timestamp \
            --sign "$SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Build .dmg
        working-directory: devtools
        run: |
          set -e
          APP="build/macos/Build/Products/Release/Orca Gateway DevTools.app"
          DMG="orca_gateway_devtools-${{ steps.version.outputs.version }}-macos.dmg"
          STAGING="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Orca Gateway DevTools" \
            -srcfolder "$STAGING" -ov -format UDZO "$DMG"
          if [ -n "$SIGNING_IDENTITY" ]; then
            codesign --force --sign "$SIGNING_IDENTITY" --timestamp "$DMG"
          fi
          echo "DMG_PATH=$PWD/$DMG" >> "$GITHUB_ENV"

      - name: Notarize and staple
        if: steps.cert.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PWD }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -e
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ${{ env.DMG_PATH }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF#devtools-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Flutter build
        working-directory: devtools
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package zip
        working-directory: devtools
        shell: pwsh
        run: |
          $zip = "orca_gateway_devtools-${{ steps.version.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $zip
          "ZIP_PATH=$pwd\$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ${{ env.ZIP_PATH }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev

      - name: Resolve version from tag
        id: version
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF#devtools-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Flutter build
        working-directory: devtools
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package tarball
        working-directory: devtools
        run: |
          ARCHIVE="orca_gateway_devtools-${{ steps.version.outputs.version }}-linux-x64.tar.gz"
          tar -C build/linux/x64/release/bundle -czf "$ARCHIVE" .
          echo "TAR_PATH=$PWD/$ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: ${{ env.TAR_PATH }}

  publish-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: DevTools ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/macos-dmg/*.dmg
            artifacts/windows-zip/*.zip
            artifacts/linux-tar/*.tar.gz
