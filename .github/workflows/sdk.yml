name: SDK CI

on:
  push:
    paths:
      - "sdk/**"
      - "schema/**"
      - ".github/workflows/sdk.yml"
  pull_request:
    paths:
      - "sdk/**"
      - "schema/**"
      - ".github/workflows/sdk.yml"

jobs:
  test:
    name: test (flutter ${{ matrix.flutter.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The SDK's minimum (pubspec `flutter: ">=3.47.0"`, from material_ui)
        # and the newest stable. Raise the first with the pubspec.
        flutter:
          - { name: "3.47.9", version: "3.47.9" }
          - { name: stable, version: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter.version }}
      - run: flutter --version
      - run: flutter pub get
        working-directory: sdk
      - run: flutter analyze
        working-directory: sdk
      - run: flutter test
        working-directory: sdk
